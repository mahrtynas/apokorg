<!doctype html>
<!--
  The Ingrid delivery widget inside /kassa/, rebuilt from the A-kronans checkout test
  (2026-10-22, postcode 11738, 24 kr order): textbox "Postnummer", button "Fortsätt", then
  radiogroup "Leveransalternativ" with three options and "Visa alla" for the rest.
  With ?broken in the parent's server mode, "Fortsätt" shows nothing (the failure test).
-->
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <title>Leverans</title>
  </head>
  <body>
    <form id="postcode-form" action="/ingrid/session">
      <label for="pc">Postnummer</label>
      <input id="pc" name="postal_code" inputmode="numeric" autocomplete="postal-code" />
      <button type="submit">Fortsätt</button>
    </form>
    <div id="options"></div>
    <script>
      // Names, times and fees as the live widget showed them on 2026-10-22 (24 kr order).
      const OPTIONS = [
        ['Hämta Express på apotek', 'Kan hämtas om 2 timmar från att du har gjort klart beställningen.', '0kr med Kronans Apotek'],
        ['Instabox paketskåp', 'Levereras imorgon runt 20:00', '19kr med Instabox'],
        ['Postnord brevlåda', 'Levereras på måndag den 26 oktober', '19kr med PostNord'],
        ['Budbee hemleverans', 'Leverans inom 1-3 dagar', '39kr med Budbee'],
        ['Postnord paketbox', 'Levereras på lördag den 24 oktober', '19kr med PostNord'],
        ['Postnord ombud', 'Levereras på lördag den 24 oktober', '19kr med PostNord'],
        ['Leverans till apotek', 'Levereras inom 2 arbetsdagar', '0kr med Kronans Apotek'],
      ];
      function show(all) {
        const box = document.getElementById('options');
        box.textContent = '';
        const group = document.createElement('div');
        group.setAttribute('role', 'radiogroup');
        group.setAttribute('aria-label', 'Leveransalternativ');
        OPTIONS.slice(0, all ? OPTIONS.length : 3).forEach(([name, eta, price], i) => {
          const label = document.createElement('label');
          const radio = document.createElement('input');
          radio.type = 'radio';
          radio.name = 'delivery';
          radio.checked = i === 1;
          radio.setAttribute('aria-label', `Leveransalternativ ${name}`);
          // Like the live widget: a screen-reader prefix inside the name, then time, then fee.
          const n = document.createElement('span');
          const sr = document.createElement('span');
          sr.className = 'sr-only';
          sr.textContent = i === 1 ? 'Vald leveransalternativ' : 'Leveransalternativ';
          n.append(sr, name);
          const e = document.createElement('small');
          e.textContent = eta;
          const p = document.createElement('span');
          p.textContent = price;
          label.append(radio, n, e, p);
          group.append(label);
        });
        const free = document.createElement('p');
        free.textContent = 'Fri frakt från 299 kr eller vid receptköp';
        box.append(group, free);
        if (!all) {
          const more = document.createElement('button');
          more.type = 'button';
          more.textContent = 'Visa alla';
          more.addEventListener('click', () => show(true));
          box.append(more);
        }
      }
      document.getElementById('postcode-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const mode = await (await fetch('/mode')).text();
        if (mode === 'broken') return;
        if (document.getElementById('pc').value.replace(/\s/g, '') === '11738') show(false);
      });
    </script>
  </body>
</html>
